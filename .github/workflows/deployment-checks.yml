name: Deployment checks

on:
  pull_request:
    branches: [main, feat/multilingual-voice-medicines]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests with PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthbridge
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: healthbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthbridge -d healthbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://healthbridge:local-ci-only@localhost:5432/healthbridge
      JWT_SECRET: local-ci-only-not-a-deployment-secret
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/core/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build Core container
        run: docker build -t healthbridge-core-ci .

  web:
    name: Web tests and production container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - name: Build Web container with shared rules
        run: docker build -f apps/web/Dockerfile -t healthbridge-web-ci .
